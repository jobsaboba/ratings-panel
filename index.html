<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b1220">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Clean Sweep">
<title>Clean Sweep — Ratings Panel</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  :root{
    --bg:#0b1220; --panel:#131c2e; --panel2:#0f172a; --line:#22304a;
    --ink:#e7eef9; --dim:#8fa3bf; --sky:#38bdf8; --sky2:#7dd3fc;
    --gold:#fbbf24; --red:#ef4444; --em:#34d399;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg); color:var(--ink); padding:12px 12px 60px; max-width:460px; margin:0 auto;
  }
  header{display:flex; justify-content:space-between; align-items:center; padding:6px 2px 12px}
  .brand{font-weight:900; font-size:1.05rem; letter-spacing:.3px}
  .brand small{display:block; font-weight:600; font-size:.62rem; color:var(--dim); letter-spacing:1px; text-transform:uppercase}
  .topbtns{display:flex; gap:6px; align-items:center}
  .iconbtn{background:var(--panel); border:1px solid var(--line); color:var(--dim); border-radius:10px;
    padding:7px 9px; font-size:.9rem; cursor:pointer}
  .iconbtn:active{border-color:var(--sky); color:var(--sky)}
  .iconbtn.spin{display:inline-block; animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  .banner{display:none; background:#271e08; border:1px solid #7c6412; color:#fde68a;
    border-radius:12px; padding:10px 12px; font-size:.78rem; margin-bottom:10px; line-height:1.5}
  .banner.show{display:block}

  .days{display:flex; gap:6px; overflow-x:auto; padding:2px 0 10px; scrollbar-width:none}
  .days::-webkit-scrollbar{display:none}
  .day{border:1px solid var(--line); background:var(--panel); color:var(--dim); border-radius:999px;
    padding:6px 11px; font-size:.72rem; font-weight:800; white-space:nowrap; cursor:pointer; flex-shrink:0}
  .day.on{background:var(--sky); border-color:var(--sky); color:#06202f}
  .day .dot{display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--em); margin-left:5px; opacity:.9}

  .stats{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-bottom:12px}
  .stat{background:var(--panel2); border:1px solid var(--line); border-radius:12px; padding:9px 10px}
  .stat b{display:block; font-size:1.05rem}
  .stat span{font-size:.62rem; color:var(--dim); text-transform:uppercase; letter-spacing:.8px}
  .srcs{display:flex; gap:6px; margin-bottom:12px; flex-wrap:wrap}
  .src{font-size:.66rem; font-weight:800; letter-spacing:.5px; padding:4px 9px; border-radius:999px;
    border:1px solid var(--line); color:var(--dim); background:var(--panel)}
  .src.ok{color:var(--em); border-color:#1d5c46}
  .src.bad{color:var(--red); border-color:#6b1d1d}

  .race{background:var(--panel); border:1px solid var(--line); border-radius:14px; margin-bottom:10px; overflow:hidden}
  .rhead{padding:10px 12px; cursor:pointer; display:flex; justify-content:space-between; align-items:center; gap:8px}
  .rhead .t{font-weight:900; font-size:.95rem}
  .rhead .t small{display:block; font-weight:600; color:var(--dim); font-size:.66rem; margin-top:2px}
  .rhead .m{font-size:.68rem; color:var(--dim); text-align:right; line-height:1.35}
  .rhead .m b{color:var(--sky2)}
  .sweepline{display:none; background:#271e08; color:#fde68a; font-weight:900; font-size:.74rem;
    letter-spacing:1px; padding:7px 12px; border-top:1px solid #7c6412}
  .sweepline.show{display:block}
  .rbody{display:none; border-top:1px solid var(--line); background:var(--panel2)}
  .race.open .rbody{display:block}
  .rrow{display:flex; align-items:center; gap:8px; padding:7px 10px; border-bottom:1px solid #1a2740; font-size:.8rem}
  .rrow:last-child{border-bottom:none}
  .rrow .pos{width:20px; color:var(--dim); font-weight:800; font-size:.7rem; text-align:center; flex-shrink:0}
  .rrow .nm{flex:1; min-width:0}
  .rrow .nm b{display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:.82rem}
  .rrow .nm small{color:var(--dim); font-size:.62rem}
  .stars{display:flex; gap:2px; flex-shrink:0}
  .stars i{font-style:normal; font-size:.62rem; line-height:1; color:#33405a}
  .stars i.f{color:var(--gold)}
  .stars b{color:var(--dim); font-size:.56rem; margin-right:2px; font-weight:800; letter-spacing:.5px; align-self:center}
  .tot{flex-shrink:0; width:44px; text-align:center; background:var(--panel); border:1px solid var(--line);
    border-radius:9px; padding:4px 0; font-weight:900; font-size:.82rem}
  .tot small{display:block; font-size:.5rem; color:var(--dim); font-weight:800; letter-spacing:.5px}
  .tot.top{border-color:#7c6412; color:var(--gold)}
  .rrow.sweep{background:#271e08}
  .rrow.sweep .tot{border-color:var(--gold); color:var(--gold)}
  .rrow.sweep .stars i.f{color:var(--gold)}
  .verds{padding:8px 12px 12px; border-top:1px solid var(--line)}
  .verd{margin-bottom:6px}
  .verd small{display:block; font-size:.6rem; color:var(--sky2); font-weight:900; letter-spacing:1px; text-transform:uppercase; margin-bottom:2px}
  .verd p{margin:0; font-size:.72rem; color:var(--dim); line-height:1.45}

  .none{padding:30px 10px; text-align:center; color:var(--dim); font-size:.8rem}
  footer{color:#3b4a66; font-size:.62rem; text-align:center; padding:18px 0 6px; line-height:1.6}
</style>
</head>
<body>
<header>
  <div class="brand">Clean Sweep<small>the ratings panel · 15/15</small></div>
  <div class="topbtns">
    <span class="iconbtn" id="dchip">—</span>
    <button class="iconbtn" id="reload" title="refresh">⟳</button>
  </div>
</header>

<div class="banner" id="offline">You're offline — showing the last downloaded day.</div>

<div class="days" id="days"></div>
<div class="stats" id="stats"></div>
<div class="srcs" id="srcs"></div>
<div id="races"><div class="none">loading…</div></div>

<footer>
  Timeform ★ via the Grail sheet · At The Races Expert View ★ · Racing Post RPR ranks ★<br>
  a clean sweep — all three say the same 5★ horse — scores 15/15. A fourth source lifts the cap to 20.
</footer>

<script>
let DAYS = [];
let CURRENT = null;
let cache = {};

const $ = s => document.querySelector(s);

async function getIndex(){
  const r = await fetch("data/index.json", {cache:"no-store"});
  return r.json();
}
async function getDay(d){
  if (cache[d]) return cache[d];
  const r = await fetch(`data/${d}.json`, {cache:"no-store"});
  const j = await r.json();
  cache[d] = j;
  return j;
}

function starPill(src, n, max){
  let s = `<b>${src}</b><span class="stars">`;
  for (let i = 0; i < max; i++)
    s += `<i class="${i < n ? 'f' : ''}">${i < n ? '★' : '☆'}</i>`;
  return s + "</span>";
}

function render(d){
  const j = cache[d];
  if (!j){ return; }
  document.getElementById("dchip").textContent = d.slice(5);
  document.querySelectorAll(".day").forEach(el => el.classList.toggle("on", el.dataset.d === d));

  const races = j.races || [];
  const sweeps = races.filter(r => r.sweep).length;
  const top = Math.max(0, ...races.map(r => r.top_total || 0));
  document.getElementById("stats").innerHTML = `
    <div class="stat"><b>${races.length}</b><span>races 8+</span></div>
    <div class="stat"><b>${sweeps}</b><span>clean sweeps</span></div>
    <div class="stat"><b>${top}<small style="font-size:.6rem;color:var(--dim)">/${j.cap || 15}</small></b><span>best panel</span></div>`;

  const s = j.sources || {};
  const chip = (k, label, v) =>
    `<span class="src ${v === 'ok' ? 'ok' : 'bad'}">${label} ${v === 'ok' ? '✓' : (v === 'gated' ? 'gated' : '✗')}</span>`;
  document.getElementById("srcs").innerHTML =
    chip("timeform","TIMEFORM",s.timeform) + chip("atr","ATR",s.atr) + chip("rp","RACING POST",s.rp);

  const box = document.getElementById("races");
  if (!races.length){
    box.innerHTML = `<div class="none">no 8+-runner races published for this day</div>`;
    return;
  }
  box.innerHTML = races.map(rc => {
    const rows = [...(rc.runners||[])].sort((a,b) => (b.total-a.total) || (a.cloth-a.cloth));
    return `
    <div class="race" data-key="${rc.time}|${rc.meeting}">
      <div class="rhead">
        <div class="t">${rc.time} ${rc.meeting}
          <small>${(rc.name||"").slice(0,64)} · ${rc.n || (rc.runners||[]).length} run${rc.cls ? " · " + rc.cls : ""}${rc.distance ? " · " + rc.distance : ""}${rc.going ? " · " + rc.going : ""}</small>
        </div>
        <div class="m">top panel <b>${rc.top_total}/${j.cap || 15}</b><br>${rc.top_horse ? rc.top_horse : "—"}</div>
      </div>
      <div class="sweepline ${rc.sweep ? 'show' : ''}">★ CLEAN SWEEP — ${rc.sweep ? rc.sweep.horse : ""} 15/15</div>
      <div class="rbody">
        ${rows.map((r,i) => `
        <div class="rrow ${r.sweep ? 'sweep' : ''}">
          <div class="pos">${i+1}</div>
          <div class="nm"><b>${r.horse}${r.nr ? ' <span style="color:var(--red);font-size:.6rem">NR</span>' : ''}</b>
            <small>TF ${r.tf ?? "–"}${r.atr_rating ? " · ATR " + r.atr_rating : ""}${r.rp_rpr ? " · RPR " + r.rp_rpr : ""}</small></div>
          ${starPill("TF", r.tf ?? 0, 5)}
          ${starPill("ATR", r.atr ?? 0, 5)}
          ${starPill("RP", r.rp ?? 0, 5)}
          <div class="tot ${r.sweep ? '' : (i === 0 ? 'top' : '')}">${r.total}${r.sweep ? '' : `<small>/${j.cap || 15}</small>`}</div>
        </div>`).join("")}
        ${(rc.verdicts && (rc.verdicts.atr || rc.verdicts.rp)) ? `
        <div class="verds">
          ${rc.verdicts.atr ? `<div class="verd"><small>ATR verdict</small><p>${rc.verdicts.atr}</p></div>` : ""}
          ${rc.verdicts.rp ? `<div class="verd"><small>Racing Post verdict</small><p>${rc.verdicts.rp}</p></div>` : ""}
        </div>` : ""}
      </div>
    </div>`;
  }).join("");

  box.querySelectorAll(".rhead").forEach(h =>
    h.addEventListener("click", () => h.closest(".race").classList.toggle("open")));
  // open the first race by default
  const first = box.querySelector(".race");
  if (first) first.classList.add("open");
}

function dayStrip(){
  const el = document.getElementById("days");
  el.innerHTML = DAYS.map(d => {
    const sweeps = cache[d] ? (cache[d].races||[]).filter(r => r.sweep).length : 0;
    return `<button class="day" data-d="${d}">${d.slice(5)}${sweeps ? '<span class="dot"></span>' : ""}</button>`;
  }).join("");
  el.querySelectorAll(".day").forEach(b =>
    b.addEventListener("click", () => { CURRENT = b.dataset.d; render(CURRENT); }));
}

async function load(){
  const btn = document.getElementById("reload");
  btn.classList.add("spin");
  try {
    const idx = await getIndex();
    DAYS = idx.days || [];
    CURRENT = idx.latest || DAYS[0];
    for (const d of DAYS.slice(0, 4)) { try { await getDay(d); } catch(e){} }
    dayStrip();
    render(CURRENT);
  } catch(e){
    document.getElementById("offline").classList.add("show");
  }
  btn.classList.remove("spin");
}

document.getElementById("reload").addEventListener("click", () => { cache = {}; load(); });
load();
</script>

<script>
if ("serviceWorker" in navigator)
  navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
